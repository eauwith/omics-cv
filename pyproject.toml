[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omics-cv"
version = "0.1.0"
description = "Leakage-aware cross-validation harnesses and omics autoencoders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
